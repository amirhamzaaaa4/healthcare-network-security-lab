<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Proposed traffic policy</title><desc id="desc">Allowed and denied paths between clinic zones.</desc><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.g{stroke:#16a34a;stroke-width:5;marker-end:url(#a)}.r{stroke:#dc2626;stroke-width:5;stroke-dasharray:9 7}.t{font:600 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#16a34a"/></marker></defs><rect class="bg" width="1000" height="420" rx="20"/><text x="500" y="38" text-anchor="middle" class="t">Proposed least-privilege traffic policy</text><rect x="55" y="90" width="180" height="70" rx="12" class="b"/><text x="145" y="120" text-anchor="middle" class="t">IT Management</text><text x="145" y="145" text-anchor="middle" class="s">authorised admins</text><rect x="410" y="90" width="180" height="70" rx="12" class="b"/><text x="500" y="120" text-anchor="middle" class="t">Infrastructure</text><text x="500" y="145" text-anchor="middle" class="s">router / switch / APs</text><line x1="235" y1="125" x2="405" y2="125" class="g"/><text x="320" y="112" text-anchor="middle" class="s">allow management</text><rect x="410" y="255" width="180" height="70" rx="12" class="b"/><text x="500" y="285" text-anchor="middle" class="t">Internal Zones</text><text x="500" y="310" text-anchor="middle" class="s">admin / clinical / services</text><rect x="765" y="255" width="180" height="70" rx="12" class="b"/><text x="855" y="285" text-anchor="middle" class="t">Guest Wi-Fi</text><text x="855" y="310" text-anchor="middle" class="s">untrusted clients</text><line x1="765" y1="290" x2="595" y2="290" class="r"/><text x="680" y="277" text-anchor="middle" class="s">deny internal access</text><rect x="765" y="90" width="180" height="70" rx="12" class="b"/><text x="855" y="120" text-anchor="middle" class="t">Simulated Internet</text><text x="855" y="145" text-anchor="middle" class="s">external test target</text><line x1="855" y1="255" x2="855" y2="165" class="g"/><text x="875" y="215" class="s">allow</text><text x="500" y="380" text-anchor="middle" class="s">Green = intended allow · red dashed = intended deny · validate with an explicit test matrix</text></svg>
